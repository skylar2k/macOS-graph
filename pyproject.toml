[project]
name = "graph-macos"
version = "0.1.0"
description = "Pipe-friendly Microsoft Graph / Intune command-line tools for macOS"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "click>=8.5.0",
    "msal>=1.39.0",
    "msal-extensions>=1.3.1",
    "requests>=2.34.2",
]

[project.scripts]
gmac = "graph_macos.cli.app:main"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "graph_macos"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]  # "." lets tests import `tests.fakes`
