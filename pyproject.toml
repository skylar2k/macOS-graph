[project]
name = "kd-graph"
version = "0.1.0"
description = "Internal Microsoft Graph tooling for the macOS team"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "msal>=1.39.0",
    "msal-extensions>=1.3.1",
    "requests>=2.34.2",
]

[project.scripts]
kd-get-devices = "kd_graph.cli.get_devices:main"
kd-delete-devices = "kd_graph.cli.delete_devices:main"
kd-disabled-users = "kd_graph.cli.disabled_users:main"
kd-get-ade-tokens = "kd_graph.cli.get_ade_tokens:main"
kd-get-enrollment-profiles = "kd_graph.cli.get_enrollment_profiles:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
