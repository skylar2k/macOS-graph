[project]
name = "graph-macos"
version = "0.1.0"
description = "Pipe-friendly Microsoft Graph / Intune command-line tools for macOS"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "msal>=1.39.0",
    "msal-extensions>=1.3.1",
    "requests>=2.34.2",
]

[project.scripts]
gmac-get-devices = "graph_macos.cli.get_devices:main"
gmac-delete-devices = "graph_macos.cli.delete_devices:main"
gmac-disabled-users = "graph_macos.cli.disabled_users:main"
gmac-get-ade-tokens = "graph_macos.cli.get_ade_tokens:main"
gmac-get-ade-devices = "graph_macos.cli.get_ade_devices:main"
gmac-get-enrollment-profiles = "graph_macos.cli.get_enrollment_profiles:main"
gmac-assign-enrollment-profile = "graph_macos.cli.assign_enrollment_profile:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "graph_macos"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
